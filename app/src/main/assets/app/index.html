<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نبضات ربيع</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Cairo','Noto Sans Arabic','Droid Arabic Naskh',sans-serif; background:linear-gradient(135deg,#fd79a8 0%,#e84393 30%,#0984e3 100%); min-height:100vh; padding:24px 16px; color:#2d3436; }
  .wrap { max-width:1250px; margin:0 auto; }
  .topbar { display:flex; justify-content:flex-end; direction:ltr; margin-bottom:6px; }
  .gear-btn { width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.25); color:#fff; border:2px solid rgba(255,255,255,.6); font-size:1.3rem; line-height:1; cursor:pointer; }
  .gear-btn:hover { background:rgba(255,255,255,.4); }
  .muted { color:#636e72; }
  .seg { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .seg button { flex:1; min-width:120px; padding:10px 14px; border:2px solid #dfe6e9; border-radius:12px; background:#fff; color:#2d3436; font-family:inherit; font-weight:700; font-size:1rem; cursor:pointer; }
  .seg button.active { background:linear-gradient(135deg,#e84393,#0984e3); border-color:transparent; color:#fff; }
  #settingsDialog { overflow:auto; }
  .pro-box { border:2px solid #e84393; border-radius:14px; padding:4px 14px 14px; margin-top:14px; }
  .pro-row { display:flex; gap:8px; }
  .pro-row input { flex:1; min-width:0; }
  #proCode { width:100%; padding:10px; border:2px solid #dfe6e9; border-radius:12px; font-family:monospace; font-size:.95rem; }
  .btn.locked::before { content:'🔒 '; }

  header { text-align:center; color:#fff; margin-bottom:18px; }
  header h1 { font-size:2rem; font-weight:800; text-shadow:0 2px 10px rgba(0,0,0,.2); display:inline-flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; }
  header p { color:rgba(255,255,255,.92); margin-top:6px; font-weight:600; }
  .tabs { display:flex; gap:10px; margin-bottom:18px; }
  .tab { flex:1; padding:14px; border:none; border-radius:16px; font-family:inherit; font-weight:700; font-size:1.02rem; background:#fff; color:#6c5ce7; cursor:pointer; box-shadow:0 8px 24px rgba(0,0,0,.12); transition:transform .2s; }
  .tab:hover { transform:translateY(-2px); }
  .tab.active { background:linear-gradient(135deg,#e84393,#0984e3); color:#fff; }
  .card { background:#fff; border-radius:20px; padding:20px; box-shadow:0 15px 40px rgba(0,0,0,.15); margin-bottom:18px; }
  .card h2 { font-size:1.15rem; color:#e84393; margin-bottom:12px; font-weight:800; }
  .card h3 { font-size:1rem; color:#636e72; margin:10px 0 6px; }
  .center { text-align:center; justify-content:center; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-weight:700; margin-bottom:6px; font-size:.95rem; }
  .field input { width:100%; padding:10px; border:2px solid #dfe6e9; border-radius:12px; font-family:inherit; font-size:1rem; }
  .upload { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .upload label.drop { flex:1; min-width:240px; border:2px dashed #e84393; border-radius:14px; padding:18px; text-align:center; cursor:pointer; background:#fff8fc; font-weight:700; color:#e84393; }
  .upload label.drop:hover { background:#ffeef7; }
  .upload label.drop span { display:block; }
  .upload small { color:#636e72; display:block; font-weight:400; margin-top:6px; line-height:1.6; }
  .msg { margin-top:12px; padding:12px 14px; border-radius:12px; font-weight:600; line-height:1.7; display:none; }
  .msg.show { display:block; }
  .msg.ok { background:#d4f8ed; color:#006b55; }
  .msg.err { background:#ffe3e3; color:#d63031; }
  .msg.info { background:#e3f2ff; color:#0b5394; }
  #appMsg { position:sticky; top:8px; z-index:20; box-shadow:0 6px 18px rgba(0,0,0,.15); margin-top:0; margin-bottom:14px; }
  .preview-actions { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
  .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:14px; }
  .stat { border-radius:14px; padding:12px 8px; color:#fff; text-align:center; font-weight:700; font-size:.95rem; }
  .stat b { display:block; font-size:1.7rem; font-weight:800; }
  .s-total { background:linear-gradient(135deg,#636e72,#2d3436); }
  .s-done { background:linear-gradient(135deg,#0984e3,#74b9ff); }
  .s-ok { background:linear-gradient(135deg,#00b894,#55efc4); }
  .s-follow { background:linear-gradient(135deg,#f9ca24,#f0932b); }
  .s-refer { background:linear-gradient(135deg,#d63031,#ff7675); }
  [hidden] { display:none !important; }
  .topbar { justify-content:space-between; }
  .searchbar { display:none; gap:8px; margin-bottom:12px; }
  .searchbar.open { display:flex; }
  .searchbar input { flex:1; min-width:0; padding:12px 14px; border:2px solid #fff; border-radius:14px; font-family:inherit; font-size:1rem; box-shadow:0 6px 18px rgba(0,0,0,.15); }
  .class-filter { width:100%; padding:10px; font-size:1rem; }
  .tools { display:flex; gap:8px; width:100%; }
  .ibtn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height:58px; padding:6px 4px; border:none; border-radius:14px; font-family:inherit; font-weight:700; font-size:.74rem; line-height:1.2; color:#fff; background:linear-gradient(135deg,#e84393,#0984e3); cursor:pointer; text-align:center; }
  .ibtn .ico, .nav-btn .ico { font-size:1.45rem; line-height:1; position:relative; }
  .ibtn.gray { background:#636e72; }
  .ibtn.red { background:#d63031; }
  .ibtn:active, .nav-btn:active { transform:scale(.96); }
  .bottom-nav { position:fixed; bottom:0; left:0; right:0; max-width:560px; margin:0 auto; z-index:30; display:flex; gap:6px; padding:8px 10px; background:rgba(255,255,255,.97); box-shadow:0 -6px 22px rgba(0,0,0,.2); border-radius:20px 20px 0 0; }
  .bottom-nav.away { display:none; }
  .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; border:none; border-radius:12px; background:none; color:#6c5ce7; font-family:inherit; font-weight:700; font-size:.72rem; cursor:pointer; }
  .nav-btn:focus-visible, .ibtn:focus-visible { outline:3px solid #fdcb6e; outline-offset:2px; }
  .nav-btn.locked .ico::after, .ibtn.locked .ico::after { content:'🔒'; position:absolute; top:-6px; inset-inline-end:-12px; font-size:.65rem; }
  .wrap { padding-bottom:88px; }
  .rules { margin-top:8px; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .toolbar input[type=search] { flex:1; min-width:200px; padding:11px 14px; border:2px solid #dfe6e9; border-radius:12px; font-family:inherit; font-size:1rem; }
  .btn { padding:11px 16px; border:none; border-radius:12px; font-family:inherit; font-weight:700; font-size:.95rem; cursor:pointer; color:#fff; background:linear-gradient(135deg,#e84393,#0984e3); transition:transform .2s; }
  .btn:hover { transform:translateY(-1px); }
  .btn.green { background:linear-gradient(135deg,#00b894,#55efc4); }
  .btn.gray { background:#636e72; }
  .btn.red { background:#d63031; }
  .mini { padding:4px 8px; border:2px solid #dfe6e9; border-radius:10px; background:#fafbff; font-family:inherit; font-size:.9rem; font-weight:700; cursor:pointer; margin:2px; }
  .mini:hover { border-color:#e84393; }
  .table-wrap { overflow:auto; max-height:68vh; border-radius:14px; border:1px solid #eee; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; min-width:1100px; }
  th, td { padding:6px; border-bottom:1px solid #eee; text-align:center; vertical-align:middle; }
  th { background:#f8f9fa; color:#636e72; font-weight:700; position:sticky; top:0; z-index:2; }
  td.name { text-align:right; font-weight:700; min-width:210px; }
  td.g { color:#636e72; font-size:.85rem; }
  td.acts { white-space:nowrap; }
  td.empty { padding:30px 20px; color:#636e72; font-weight:600; text-align:start; white-space:normal; line-height:1.8; }
  td.empty .empty-box { max-width:300px; }
  tr.extra td { background:#fff8fc; }
  tr.hidden { display:none; }
  input[type=number] { width:76px; padding:7px 6px; border:2px solid #dfe6e9; border-radius:10px; font-family:inherit; font-size:.95rem; text-align:center; background:#fafbff; }
  input.txt { width:100%; min-width:160px; padding:7px 8px; border:2px solid #dfe6e9; border-radius:10px; font-family:inherit; font-size:.95rem; background:#fafbff; }
  select { padding:6px; border:2px solid #dfe6e9; border-radius:10px; font-family:inherit; font-size:.88rem; background:#fff; }
  input[type=checkbox] { width:18px; height:18px; accent-color:#d63031; cursor:pointer; }
  input:focus, select:focus { outline:none; border-color:#e84393; box-shadow:0 0 0 3px rgba(232,67,147,.15); }
  .tab:focus-visible, .btn:focus-visible, .mini:focus-visible, .gear-btn:focus-visible, .seg button:focus-visible, select:focus-visible, input:focus-visible { outline:3px solid #fdcb6e; outline-offset:2px; }
  .badge { display:inline-block; padding:4px 10px; border-radius:20px; font-weight:700; font-size:.82rem; color:#fff; white-space:nowrap; }
  .badge.ok { background:#00b894; }
  .badge.follow { background:#f0932b; }
  .badge.refer { background:#d63031; }
  .badge.incomplete { background:#b2bec3; color:#2d3436; }
  .badge.none { background:none; color:#b2bec3; font-weight:400; }
  .flags { font-size:.75rem; color:#636e72; margin-top:3px; line-height:1.5; }
  .rules { background:#f1f2f6; border-radius:14px; padding:12px 14px; font-size:.88rem; line-height:1.8; margin-top:14px; }
  .rules b { color:#e84393; }
  .note { background:#ffeaa7; border-radius:12px; padding:12px; font-size:.88rem; line-height:1.7; margin-top:10px; }
  .timer-card { text-align:center; }
  .timer-display { font-size:4.5rem; font-weight:800; line-height:1.1; margin:6px 0 4px; font-variant-numeric:tabular-nums; color:#e84393; }
  .timer-display.running { color:#0984e3; }
  .timer-display.done { color:#00b894; animation:tpulse 1s infinite; }
  @keyframes tpulse { 50% { transform:scale(1.06); } }
  .timer-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
  .timer-actions .btn { flex:0 1 200px; }
  #tMsg { margin-top:10px; }
  .solo-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .solo-grid label { display:block; font-weight:700; margin-bottom:4px; font-size:.92rem; }
  .solo-grid input, .solo-grid select { width:100%; padding:10px; border:2px solid #dfe6e9; border-radius:12px; font-family:inherit; font-size:1rem; }
  .solo-result { margin-top:16px; text-align:center; }
  .solo-result .badge { font-size:1.1rem; padding:8px 16px; }
  .solo-result .flags { margin-top:8px; }
  .advanced summary, .sub summary { cursor:pointer; font-weight:800; color:#e84393; font-size:1.05rem; }
  .adv-body { margin-top:12px; }
  .sub { margin:10px 0; }
  .sub textarea { width:100%; padding:10px; border:2px solid #dfe6e9; border-radius:12px; font-family:inherit; margin-top:8px; }
  .info-card { text-align:center; }
  .info-card h2 { justify-content:center; }
  .info-links { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .info-links a { text-decoration:none; color:#fff; padding:11px 16px; border-radius:12px; background:linear-gradient(135deg,#e84393,#0984e3); font-weight:700; }
  .fb-link { display:inline-flex; align-items:center; gap:10px; text-decoration:none; color:#1877F2; font-weight:700; margin-top:14px; }
  .dev-credit { margin:6px auto 0; text-align:center; color:#fff; padding:16px 20px; border-radius:18px; background:rgba(255,255,255,.18); backdrop-filter:blur(4px); box-shadow:0 10px 30px rgba(0,0,0,.15); max-width:360px; }
  .dev-credit a { color:inherit; text-decoration:none; display:block; }
  .dev-credit a:hover .dev-name { text-decoration:underline; }
  .dev-credit .dev-name { font-size:1.5rem; font-weight:800; letter-spacing:.5px; direction:ltr; text-shadow:0 2px 8px rgba(0,0,0,.2); }
  .dev-credit .dev-role { font-size:1rem; font-weight:600; opacity:.92; margin-top:4px; direction:ltr; }
  /* سجل الجلسات */
  dialog { margin:auto; border:none; border-radius:20px; padding:22px; width:min(780px, 94vw); max-height:90vh; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  dialog::backdrop { background:rgba(45,52,54,.55); }
  dialog h2 { color:#e84393; font-size:1.2rem; margin-bottom:10px; }
  .chart-box { margin-bottom:14px; }
  .chart-box h3 { font-size:.98rem; color:#2d3436; }
  .legend { font-size:.82rem; color:#636e72; text-align:center; margin-top:4px; }
  .hist-scroll { overflow:auto; max-height:30vh; border:1px solid #eee; border-radius:12px; }
  .hist-table { min-width:0; font-size:.82rem; }
  .hist-table th { white-space:normal; padding:4px 3px; }
  .hist-table td { white-space:nowrap; padding:5px 3px; }
  .hist-table .badge { font-size:.68rem; padding:2px 7px; }
  .hist-none { color:#636e72; line-height:1.8; padding:16px 0; }
  /* الوضع الليلي: على الشاشة فقط، ولا يؤثر على الطباعة */
  @media screen {
    html[data-theme="dark"] { color-scheme:dark; }
    html[data-theme="dark"] body { background:linear-gradient(135deg,#2b1b3a 0%,#1b2038 50%,#0d2a4a 100%); color:#e8eaf0; }
    html[data-theme="dark"] .card, html[data-theme="dark"] dialog { background:#1f2433; color:#e8eaf0; }
    html[data-theme="dark"] .card h3, html[data-theme="dark"] .muted, html[data-theme="dark"] .legend, html[data-theme="dark"] .hist-none, html[data-theme="dark"] .flags, html[data-theme="dark"] .upload small, html[data-theme="dark"] td.g, html[data-theme="dark"] td.empty { color:#a3adbf; }
    html[data-theme="dark"] .chart-box h3 { color:#e8eaf0; }
    html[data-theme="dark"] input, html[data-theme="dark"] select, html[data-theme="dark"] textarea { background:#2a3042; color:#e8eaf0; border-color:#3a4258; }
    html[data-theme="dark"] input::placeholder, html[data-theme="dark"] textarea::placeholder { color:#7f8aa0; }
    html[data-theme="dark"] th { background:#272d3f; color:#a3adbf; }
    html[data-theme="dark"] th, html[data-theme="dark"] td { border-bottom-color:#2f3650; }
    html[data-theme="dark"] .table-wrap, html[data-theme="dark"] .hist-scroll { border-color:#2f3650; }
    html[data-theme="dark"] tr.extra td { background:#2a2236; }
    html[data-theme="dark"] .rules { background:#262c3d; }
    html[data-theme="dark"] .note { background:#4a4222; color:#f3e7b0; }
    html[data-theme="dark"] .msg.ok { background:#0f3d33; color:#7ff0c8; }
    html[data-theme="dark"] .msg.err { background:#4a1f22; color:#ff9b9b; }
    html[data-theme="dark"] .msg.info { background:#1c3550; color:#9bc9ff; }
    html[data-theme="dark"] .mini { background:#2a3042; border-color:#3a4258; color:#e8eaf0; }
    html[data-theme="dark"] .tab, html[data-theme="dark"] .seg button { background:#1f2433; border-color:#3a4258; color:#c5b8ff; }
    html[data-theme="dark"] .tab.active, html[data-theme="dark"] .seg button.active { background:linear-gradient(135deg,#e84393,#0984e3); color:#fff; }
    html[data-theme="dark"] .upload label.drop { background:#2a2236; }
    html[data-theme="dark"] .badge.incomplete { background:#4a5163; color:#e8eaf0; }
    html[data-theme="dark"] .bottom-nav { background:rgba(31,36,51,.97); }
    html[data-theme="dark"] .nav-btn { color:#c5b8ff; }
    html[data-theme="dark"] .searchbar input { border-color:#3a4258; }
    html[data-theme="dark"] .fb-link { color:#6ea8ff; }
  }
  /* التقرير المطبوع: مخفي على الشاشة */
  #printReport { display:none; }
  @media (max-width:850px) { .stats { grid-template-columns:repeat(5,1fr); gap:6px; } .stat { padding:8px 2px; font-size:.7rem; line-height:1.25; } .stat b { font-size:1.35rem; } }
  @media (max-width:560px) {
    body { padding:16px 12px; }
    .tabs { flex-direction:column; }
    header h1 { font-size:1.6rem; }
    .timer-display { font-size:3.6rem; }
    .timer-actions .btn { flex:1 1 140px; }
  }
  @page { size:A4; margin:12mm; }
  @media print {
    body { background:#fff; padding:0; }
    .wrap, dialog { display:none !important; }
    #printReport { display:block; color:#000; font-size:11pt; }
    #printReport table { min-width:0; width:100%; font-size:9pt; border:1px solid #999; }
    #printReport th, #printReport td { border:1px solid #bbb; padding:4px; }
    #printReport th { background:#eee; position:static; }
    .report-foot { margin-top:14px; font-size:9pt; color:#444; }
  }
</style>
</head>
<body>

<div id="printReport"></div>

<div class="wrap">
  <div class="msg err show" id="jsWarn">⚠️ المتصفح لم يشغّل الصفحة. افتحها بمتصفح Chrome محدّث، أو حدّث التطبيق الحالي.</div>

  <div class="topbar">
    <button class="gear-btn" id="searchBtn" type="button" data-i18n-title="search.btn" aria-label="Search" aria-expanded="false">🔍</button>
    <button class="gear-btn" id="settingsBtn" type="button" data-i18n-title="settings.title" aria-label="Settings">⚙️</button>
  </div>
  <div class="searchbar" id="searchBar">
    <input type="search" id="search" data-i18n-ph="search.ph" autocomplete="off">
    <button class="btn gray" id="searchClose" type="button" data-i18n-title="search.close" aria-label="Close">✖</button>
  </div>

  <header>
    <h1>🫀 نبضات ربيع</h1>
    <p data-i18n="app.sub"></p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab active" type="button" role="tab" data-view="teachers" data-i18n="tab.teachers"></button>
    <button class="tab" type="button" role="tab" data-view="solo" data-i18n="tab.solo"></button>
  </div>

  <div class="msg" id="appMsg"></div>

  <section class="card timer-card">
    <h2 class="center" data-i18n="timer.title"></h2>
    <div class="timer-display" id="tDisplay" aria-live="polite">01:00</div>
    <div class="timer-actions">
      <button class="btn green" id="tStart" type="button"></button>
      <button class="btn gray" id="tReset" type="button" data-i18n="timer.reset"></button>
    </div>
    <div class="msg" id="tMsg"></div>
  </section>

  <div id="viewTeachers">
    <section class="card">
      <h2 data-i18n="list.title"></h2>
      <div class="upload">
        <label class="drop" for="file">
          <span data-i18n="list.drop"></span>
          <small data-i18n="list.dropHelp"></small>
        </label>
      </div>
      <div class="field" style="margin-top:12px">
        <label for="fallbackClass" data-i18n="list.classLabel"></label>
        <input id="fallbackClass" data-i18n-ph="list.classPh">
      </div>
      <p style="margin-top:12px"><input type="file" id="file" accept=".xlsx,.csv"></p>
      <div class="msg" id="importMsg"></div>
    </section>

    <section class="card">
      <div class="stats">
        <div class="stat s-total"><span data-i18n="stats.total"></span><b id="sTotal">0</b></div>
        <div class="stat s-done"><span data-i18n="stats.done"></span><b id="sDone">0</b></div>
        <div class="stat s-ok"><span data-i18n="stats.ok"></span><b id="sOk">0</b></div>
        <div class="stat s-follow"><span data-i18n="stats.follow"></span><b id="sFollow">0</b></div>
        <div class="stat s-refer"><span data-i18n="stats.refer"></span><b id="sRefer">0</b></div>
      </div>

      <div class="toolbar">
        <select id="classFilter" class="class-filter"></select>
        <div class="tools">
          <button class="ibtn" id="addExtra" type="button" data-i18n-title="btn.addExtra"><span class="ico">➕</span><span class="lbl" data-i18n="tool.add"></span></button>
          <button class="ibtn gray" id="clear" type="button" data-i18n-title="btn.clear"><span class="ico">🧹</span><span class="lbl" data-i18n="tool.clear"></span></button>
          <button class="ibtn red" id="removeList" type="button" data-i18n-title="btn.removeList"><span class="ico">🗑️</span><span class="lbl" data-i18n="tool.remove"></span></button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th data-i18n="th.class"></th>
              <th data-i18n="th.name"></th>
              <th data-i18n="th.gender"></th>
              <th data-i18n="th.age"></th>
              <th data-i18n="th.pre"></th>
              <th data-i18n="th.post"></th>
              <th data-i18n="th.rec"></th>
              <th data-i18n="th.protocol"></th>
              <th data-i18n="th.symptoms"></th>
              <th data-i18n="th.result"></th>
              <th data-i18n="th.session"></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

    </section>
  </div>

  <section class="card" id="viewSolo" hidden>
    <h2 data-i18n="solo.title"></h2>
    <p class="muted" style="margin-bottom:14px" data-i18n="solo.intro"></p>
    <div class="solo-grid">
      <div><label for="sName" data-i18n="solo.name"></label><input id="sName"></div>
      <div><label for="sGender" data-i18n="solo.gender"></label><select id="sGender"><option value="" data-i18n="gender.none"></option><option value="m" data-i18n="gender.m"></option><option value="f" data-i18n="gender.f"></option></select></div>
      <div><label for="sAge" data-i18n="solo.age"></label><input id="sAge" type="number" min="6" max="18"></div>
      <div><label for="sPre" data-i18n="solo.pre"></label><input id="sPre" type="number" min="30" max="200"></div>
      <div><label for="sPost" data-i18n="solo.post"></label><input id="sPost" type="number" min="30" max="240"></div>
      <div><label for="sRec" data-i18n="solo.rec"></label><input id="sRec" type="number" min="30" max="240"></div>

    <div class="solo-result" id="soloResult"></div>
    <div class="preview-actions"><button class="btn gray" id="sClear" type="button" data-i18n="btn.clearFields"></button></div>

  <nav class="bottom-nav" id="bottomNav" aria-label="Tools">

  </nav>

  <footer class="dev-credit" aria-label="Ali.dz">

      <div class="dev-name">Ali.dz</div>
      <div class="dev-role" data-i18n="dev.role"></div>

  <h3 data-i18n="settings.language"></h3>
  <div class="seg" id="langSeg">
    <button type="button" data-lang="ar">العربية</button>
    <button type="button" data-lang="fr">Français</button>
  </div>

  <h3 data-i18n="settings.theme"></h3>
  <div class="seg" id="themeSeg">
    <button type="button" data-theme="light" data-i18n="settings.light"></button>
    <button type="button" data-theme="dark" data-i18n="settings.dark"></button>
  </div>

  <div id="proBox" class="pro-box" hidden>
    <h3 data-i18n="pro.title"></h3>
    <p class="muted" style="font-size:.88rem; line-height:1.7" data-i18n="pro.help"></p>
    <div id="proActive" class="msg ok show" style="display:none" data-i18n="pro.active"></div>
    <div id="proForm">
      <div class="field">
        <label for="proDeviceId" data-i18n="pro.deviceId"></label>
        <div class="pro-row">
          <input id="proDeviceId" type="text" readonly dir="ltr">
          <button class="btn gray" id="proCopy" type="button" data-i18n="pro.copy"></button>
        </div>
      </div>
      <div class="field">
        <label for="proCode" data-i18n="pro.code"></label>
        <textarea id="proCode" rows="3" dir="ltr" autocapitalize="characters" autocomplete="off" spellcheck="false"></textarea>
      </div>
      <div class="preview-actions"><button class="btn green" id="proActivate" type="button" data-i18n="pro.activate"></button></div>
      <p class="muted" style="font-size:.85rem; line-height:1.7; margin-top:10px" data-i18n="pro.contact"></p>

  <details class="sub">

    <div class="rules" data-i18n-html="rules.html"></div>

  </details>

  <details class="sub">
    <summary data-i18n="info.title"></summary>
    <div class="info-links" style="margin-top:10px">
      <a href="terms.html" data-i18n="info.terms"></a>
      <a href="privacy.html" data-i18n="info.privacy"></a>
    </div>
    <div style="text-align:center">
      <a class="fb-link" href="https://www.facebook.com/share/19etGLcxMB/">
        <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5" fill="#1877F2"/><path fill="#fff" d="M16.7 15.5l.5-3.4h-3.3V9.9c0-.9.5-1.8 1.9-1.8h1.5V5.2s-1.4-.2-2.7-.2c-2.7 0-4.5 1.6-4.5 4.6v2.5H7.1v3.4h3.1V24h3.8v-8.5z"/></svg>
        <span data-i18n="info.fb"></span>
      </a>
    </div>
  </details>

  <h3 style="margin-top:18px" data-i18n="adv.title"></h3>
  <div class="adv-body">
        <details class="sub">
          <summary data-i18n="adv.pasteSummary"></summary>
          <p class="muted" style="font-size:.88rem; margin:8px 0" data-i18n="adv.pasteHelp"></p>
          <textarea id="pasteBox" rows="5"></textarea>
          <div class="preview-actions"><button class="btn" id="parsePaste" type="button" data-i18n="btn.parsePaste"></button></div>
        </details>

        <h3 data-i18n="adv.restoreTitle"></h3>
        <p class="muted" style="font-size:.88rem; line-height:1.7" data-i18n="adv.restoreHelp"></p>
        <p style="margin-top:8px"><input type="file" id="restoreFile" accept=".json,application/json"></p>

        <div class="preview-actions" style="margin-top:16px">
          <button class="btn red" id="wipe" type="button" data-i18n="adv.wipe"></button>
        </div>
  </div>
  <div class="preview-actions"><button class="btn gray" id="settingsClose" type="button" data-i18n="hist.close"></button></div>
