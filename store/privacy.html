<body style="font-family:sans-serif;padding:16px;line-height:1.9"><h1>سياسة الخصوصية - نبضات ربيع</h1>
<p>التطبيق يعمل بالكامل على جهازك دون إنترنت. لا يرسل أي بيانات إلى أي خادم، ولا يستعمل أدوات تتبع أو إعلانات.</p>
<p>البيانات التي تُدخلها (أسماء التلاميذ، تواريخ الميلاد، القياسات) تُحفظ محلياً على هذا الجهاز فقط، ويمكنك حذفها في أي وقت من زر «حذف القائمة».</p>
