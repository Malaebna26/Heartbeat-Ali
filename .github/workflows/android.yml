name: بناء نبضات ربيع

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: إعداد JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: فحص JavaScript والاختبارات
        run: |
          for f in app/src/main/assets/app/js/*.js; do node --check "$f"; done
          node --test tests/core.test.js tests/parser.test.js
          python3 - <<'PY'
          import re, pathlib
          files = ['app/src/main/assets/app/index.html'] + [str(f) for f in pathlib.Path('app/src/main/assets/app/js').glob('*.js')]
          for name in files:
              text = pathlib.Path(name).read_text(encoding='utf-8')
              ext = re.findall(r'(?:https?:)?//[^\s"\')]+', text)
              ext = [e for e in ext if 'facebook.com/share/19etGLcxMB' not in e]
              assert not ext, f'{name}: روابط خارجية غير مسموحة: {ext}'
          print('الصفحات والسكربتات سليمة وبلا روابط خارجية، والاختبارات نجحت')
          PY

      - name: توقيع الإصدار (اختياري، إن وُجدت الأسرار)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo 'لا توجد أسرار توقيع: سيُبنى AAB غير موقّع'
            exit 0
          fi
          # إزالة أي أسطر فارغة أو مسافات زائدة قد تأتي مع النسخ واللصق
          clean() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          STORE_PASSWORD=$(clean "$STORE_PASSWORD")
          KEY_PASSWORD=$(clean "$KEY_PASSWORD")
          KEY_ALIAS=$(clean "$KEY_ALIAS")
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > release-key.jks
          # 1) هل فكّ الـ base64 يعطي المفتاح الصحيح؟ (بصمة الملف المتوقعة، ليست سراً)
          if [ "$(sha256sum release-key.jks | cut -d' ' -f1)" = "edc28baed22798f0e1f3b3a840494335971c626557bc3644ecb04b361a771ad7" ]; then
            echo 'KEYSTORE_BASE64: صحيح'
          else
            echo 'KEYSTORE_BASE64: خاطئ (المحتوى المنسوخ لا يطابق المفتاح)'
            exit 1
          fi
          # 2) هل كلمة المرور صحيحة؟
          if ! keytool -list -keystore release-key.jks -storepass "$STORE_PASSWORD" > /dev/null 2>&1; then
            echo 'STORE_PASSWORD: خاطئة'
            exit 1
          fi
          echo 'STORE_PASSWORD: صحيحة'
          # 3) هل اسم المفتاح صحيح؟ نعرض الأسماء الموجودة (ليست سراً)
          echo "الأسماء الموجودة في المفتاح: $(keytool -list -keystore release-key.jks -storepass "$STORE_PASSWORD" 2>/dev/null | grep PrivateKeyEntry | cut -d, -f1)"
          echo "طول KEY_ALIAS المدخل: ${#KEY_ALIAS} حرف"
          if ! keytool -list -keystore release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo 'KEY_ALIAS: خاطئ، انظر الأسماء الموجودة أعلاه'
            exit 1
          fi
          echo 'KEY_ALIAS: صحيح'
          echo 'تم التحقق من مفتاح التوقيع بنجاح'
          printf 'storeFile=release-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: الفحص والاختبار (Lint)
        run: gradle :app:lintRelease --no-daemon
        continue-on-error: true

      - name: بناء APK للتجربة (debug)
        run: gradle :app:assembleDebug --no-daemon

      - name: بناء AAB للنشر (release)
        run: gradle :app:bundleRelease --no-daemon

      - name: التحقق من عدم وجود صلاحية الإنترنت
        run: |
          MANIFEST=$(find app/build/intermediates/merged_manifests/release -name AndroidManifest.xml | head -1)
          test -n "$MANIFEST" || { echo 'لم يُعثر على المانيفست المدمج'; exit 1; }
          echo "المانيفست: $MANIFEST"
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo 'خطأ: صلاحية INTERNET موجودة' && exit 1
          fi
          echo 'لا توجد صلاحية INTERNET'

      - name: نشر الملفات في Release (على الفرع الرئيسي فقط)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          FILES=$(ls app/build/outputs/apk/debug/*.apk app/build/outputs/bundle/release/*.aab)
          gh release create "$TAG" $FILES \
            --repo "$GITHUB_REPOSITORY" \
            --title "نبضات ربيع - بناء $GITHUB_RUN_NUMBER" \
            --notes "بناء تلقائي من الكوميت $GITHUB_SHA. APK للتجربة، وAAB للنشر (يحتاج توقيعاً قبل الرفع على Play)."
